<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>New Tab</title>
<style>
  html { background: #efefea; color: #121212; }
  @media (prefers-color-scheme: dark) { html { background: #0f0f0e; color: #ececE6; } }
  html[data-look="paper"] { background: #efefea; color: #121212; }
  html[data-look="night"] { background: #0f0f0e; color: #ececE6; }
  html[data-look="ultramarine"] { background: #0a12e6; color: #f2f2ee; }
  html[data-look="native"][data-scheme="light"] { background: #ffffff; color: #1f1f1f; }
  html[data-look="native"][data-scheme="dark"] { background: #1f1f1f; color: #e3e3e3; }
  html[data-look="native"][data-browser="edge"][data-scheme="light"] { background: #f3f3f3; }
  html[data-look="native"][data-browser="edge"][data-scheme="dark"] { background: #202020; }
  html[data-look="indigo"] { background: #eceae3; color: #1f2470; }
  html[data-look="cobalt"] { background: #13174a; color: #ecebe4; }
  html[data-look="field"] { background: #ff5a1f; color: #111111; }
  html[data-look="phosphor"] { background: #0b1610; color: #b8f5c8; }
  html[data-look="sand"] { background: #efe6d8; color: #2b2118; }
  html[data-look="mono"] { background: #ffffff; color: #000000; }
  html[data-look="custom"] { background: var(--c-bg, #f1ede4); color: var(--c-ink, #1d1b16); }
  html[data-look="picture"] { background: var(--c-bg, #16181d); color: var(--c-ink, #f2f0ea); }
  html[data-look="space"] { background: var(--sp-frame, #e8e6f6); color: var(--sp-ink, #1d1b26); }
  html[data-off] { background: transparent; }
</style>
<script src="nt-boot.js"></script>
<link rel="stylesheet" href="ui.css">
</head>
<body data-ctx="newtab">
<script src="ui.js"></script>
</body>
</html>
